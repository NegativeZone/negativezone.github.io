---
layout: default
---
<article>
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; all posts</a>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  {{ content }}
</article>
